  const b = $("#qe-save"); b.disabled = true; b.textContent = "Saving…";
  try { await S.db.rpc("bulk_apply", { changes: chs.map(c => { const o = Object.assign({}, c); delete o._have; delete o._title; return o; }) }); toast(`Saved ${plural(chs.length, "change")}`); setQuickEdit(false); }
  catch (e) { toast((e && e.message) || "Couldn't save. Check signal and try again.", null, null, true); qeBarUI(); }
}

/* ---------- move between locations ---------- */
function openMove(it, t){
  const box = $("#it-movebox"); box.hidden = !box.hidden; if (box.hidden) return;
  const locs = S.locs.slice().sort((a,b) => (a.sort ?? 999) - (b.sort ?? 999) || byName(a,b));
  const have = l => (t && t[l]) || 0;
  const from = locs.slice().sort((a,b) => have(b.id) - have(a.id))[0] || locs[0];
  const to = locs.find(l => l.id !== (from && from.id)) || locs[0];
  const opts = sel => locs.map(l => `<option value="${esc(l.id)}" ${l.id === sel ? "selected" : ""}>${esc(l.name)} (${have(l.id)})</option>`).join("");
  $("#mv-from").innerHTML = opts(from && from.id); $("#mv-to").innerHTML = opts(to && to.id);
  const q = $("#mv-qty"), err = $("#mv-err");
  const sync = () => { const h = have($("#mv-from").value); $("#mv-have").textContent = `(${h} in ${locName($("#mv-from").value)})`; };
  q.value = String(Math.min(1, have(from && from.id)) || 1); sync();
  $("#mv-from").onchange = sync;
  q.oninput = () => { q.value = q.value.replace(/[^0-9]/g, "").slice(0, 5); };
  $("#mv-minus").onclick = () => { q.value = String(Math.max(1, (parseInt(q.value, 10) || 1) - 1)); };
  $("#mv-plus").onclick = () => { q.value = String((parseInt(q.value, 10) || 0) + 1); };
  $("#mv-go").onclick = () => {
    err.textContent = "";
    const f = $("#mv-from").value, d = $("#mv-to").value, n = parseInt(q.value, 10) || 0;
    if (f === d) { err.textContent = "Pick two different locations."; return; }
    if (n <= 0) { err.textContent = "Enter how many to move."; return; }
    if (n > have(f)) { err.textContent = `Only ${have(f)} in ${locName(f)}.`; return; }
    const db = S.db, now = Date.now(), tid = "T" + now.toString(36) + Math.random().toString(36).slice(2, 6);
    const base = { item_id:it.id, type:"transfer", transfer_id:tid, note:`Moved ${locName(f)} → ${locName(d)}`, photo:null, by:S.uid, at:new Date(now).toISOString(), ts:now };
    const out = db.collection("moves").doc(), inn = db.collection("moves").doc();
    // both rows go out together so the totals never show half a move
    write(() => Promise.all([
      out.set(Object.assign({}, base, { qty:-n, location_id:f, bin:"" })),
      inn.set(Object.assign({}, base, { qty:n, location_id:d, bin:"" })),
    ]), "the move");
    toast(`Moved ${n} to ${locName(d)}`, "Undo", () => undoMove(out.id));
    openItem(it.id);
  };
  setTimeout(() => box.scrollIntoView({ block:"nearest", behavior:"smooth" }), 30);
}

/* ---------- scan a QR label ---------- */
let scanStream = null, scanTimer = null;
function stopScan(){ clearTimeout(scanTimer); scanTimer = null; if (scanStream) { scanStream.getTracks().forEach(tr => tr.stop()); scanStream = null; } }
const codeFrom = text => { const v = String(text || "").trim(); const h = v.lastIndexOf("#"); return (h >= 0 ? v.slice(h + 1) : v).trim().toUpperCase(); };
function openScan(){
  closePicker();
  const sc = $("#scrim"); sc.hidden = false;
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sc-t">
    <div class="sh-hd"><h3 id="sc-t">Scan a label<small>Point the camera at a bin's QR code</small></h3><button class="iconbtn" id="sc-x" type="button">Close</button></div>
    <div class="det">
      <div class="cam"><video id="sc-v" playsinline muted autoplay></video><div class="aim"></div></div>
      <p class="scanmsg" id="sc-msg">Starting camera…</p>
      <div class="manual"><input id="sc-code" placeholder="Or type a code, e.g. SUS-7K3Q" autocomplete="off" autocapitalize="characters" enterkeyhint="go"><button class="btn" id="sc-open" type="button">Open</button></div>
    </div></div>`;
  $("#sc-x").onclick = closePicker;
  const openCode = c => openByCode(codeFrom(c));
  $("#sc-open").onclick = () => { if (!openCode($("#sc-code").value)) $("#sc-msg").textContent = "No item with that code."; };
  $("#sc-code").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#sc-open").click(); } };
  const msg = t => { const m = $("#sc-msg"); if (m) m.textContent = t; };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg("This browser can't use the camera here. Type the code instead."); return; }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false }).then(stream => {
    if ($("#scrim").hidden || !$("#sc-v")) { stream.getTracks().forEach(tr => tr.stop()); return; }
    scanStream = stream;
    const v = $("#sc-v"); v.srcObject = stream; v.play().catch(() => {});
    msg("Looking for a QR code…");
    const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently:true });
    let lastMiss = "";
    const tick = () => {
      if (!scanStream) return;
      if (v.readyState >= 2 && v.videoWidth) {
        const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
        c.width = w; c.height = h; x.drawImage(v, 0, 0, w, h);
        const r = window.jsQR ? window.jsQR(x.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:"dontInvert" }) : null;
        if (r && r.data) {
          if (navigator.vibrate) navigator.vibrate(60);
          if (openCode(r.data)) return;
          const code = codeFrom(r.data);
          if (code !== lastMiss) { lastMiss = code; msg(`No item with code ${code}. Try another label.`); }
        }
      }
      scanTimer = setTimeout(tick, 140);
    };
    tick();
  }).catch(() => msg("Camera is blocked. Allow camera access for this site in your browser settings, or type the code below."));
}

      <div class="sh-hd"><h3 id="lb-t">Print labels<small>${list.length ? `${plural(list.length, "label")} for the items showing in Stock` : "No items showing"}</small></h3><button class="iconbtn" id="lb-x" type="button">Close</button></div>

async function makeLabelPdf(list, fmt){
  const err = $("#lb-err"), go = $("#lb-go");
  if (!window.jspdf || !window.QRCode) { err.textContent = "The label tools didn't load. Check signal and reload."; return; }
  go.disabled = true; go.textContent = "Making…";
  try {
    const { jsPDF } = window.jspdf;
    let doc;
    if (fmt === "roll") {
      doc = new jsPDF({ orientation:"landscape", unit:"in", format:[3.5, 1.5] });
      list.forEach(([it, o], i) => { if (i) doc.addPage([3.5, 1.5], "landscape"); doc.addImage(labelCanvas(it, o).toDataURL("image/png"), "PNG", 0, 0, 3.5, 1.5); });
    } else {
      // Avery 5163: 2 columns x 5 rows of 4 x 2 in labels on letter paper
      doc = new jsPDF({ orientation:"portrait", unit:"in", format:"letter" });
      const left = 0.156, top = 0.5, w = 4, h = 2, gap = 0.188, ih = w * 450 / 1050;
      list.forEach(([it, o], i) => {
        const k = i % 10; if (i && !k) doc.addPage("letter", "portrait");
        const col = k % 2, row = Math.floor(k / 2);
        doc.addImage(labelCanvas(it, o).toDataURL("image/png"), "PNG", left + col * (w + gap), top + row * h + (h - ih) / 2, w, ih);
      });
    }
    const blob = doc.output("blob");
    await S.downloads.save({ filename:`labels-${new Date().toISOString().slice(0,10)}.pdf`, data:blob });
    closePicker(); toast(`Made ${plural(list.length, "label")}`);
  } catch (e) {
    if (e && e.code === "declined") { go.disabled = false; go.textContent = "Make PDF"; return; }
    err.textContent = "Couldn't make the PDF. Try fewer labels or reload."; go.disabled = false; go.textContent = "Make PDF";
  }
}

/* Overview: numbers at a glance, what the crew did, reports */
function activity(limit){
  const ev = [];
  for (const m of S.moves){
    if (m.type === "transfer" && Number(m.qty) < 0) continue; // a Move is two rows; show it once
    const it = find(S.items, m.item_id); if (!it) continue;
    const q = Number(m.qty) || 0, nm = itemTitle(it);
    const what = m.type === "transfer" ? `Moved ${q} × ${nm}` : m.type === "used" ? `Used ${-q} × ${nm}` : m.type === "damaged" ? `Damaged ${-q} × ${nm}` : `${q > 0 ? "+" : ""}${q} × ${nm}`;
    const where = m.type === "transfer" ? (m.note || "to " + locName(m.location_id)) : locName(m.location_id) + (m.bin ? " · " + m.bin : "");
    ev.push({ ts:m.ts || Date.parse(m.at) || 0, by:m.by, what, where, note: m.type === "transfer" ? "" : (m.note || ""), photo:!!m.photo, key:"data-item", id:it.id });
  }
  for (const u of S.units){ const it = find(S.items, u.item_id) || {}; ev.push({ ts:Date.parse(u.created_at) || 0, by:u.created_by, what:`Added ${it.part_id ? itemTitle(it) : "unit"} #${u.serial}`, where:locName(u.location_id), note:u.notes || "", photo:!!u.photo, key:"data-unit", id:u.id }); }
  for (const l of S.ulog){
    const u = find(S.units, l.unit_id); if (!u) continue;
    ev.push({ ts:l.ts || Date.parse(l.at) || 0, by:l.by, what:`${LOG_TYPES[l.type] || l.type} · #${u.serial}`, where:[l.hours != null && l.hours !== "" ? num1(l.hours) + " h" : "", l.laps != null && l.laps !== "" ? l.laps + " laps" : ""].filter(Boolean).join(" · "), note:l.note || "", photo:(l.files || []).length > 0, key:"data-unit", id:u.id });
  }
  return ev.sort((a, b) => b.ts - a.ts).slice(0, limit);
}

  async function run(fn){ try { return await inOrder(fn); } finally { await refreshAll().catch(() => {}); } }
  async function rpc(name, args){
    return run(async () => { const { data, error } = await sb.rpc(name, args); if (error) throw error; return data; });
  }
  let first = true;
  const ch = sb.channel("inventory-live");
  TABLES.forEach(t => ch.on("postgres_changes", { event:"*", schema:"public", table:t }, p => {
    if (p.eventType === "DELETE") { if (p.old && p.old.id) drop(t, p.old.id); }
    else if (p.new && p.new.id) put(t, p.new);
  }));
  ch.subscribe(status => {
    if (status === "SUBSCRIBED") { if (!first) refreshAll().catch(() => {}); first = false; }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll().catch(() => {}); });
  window.addEventListener("online", () => refreshAll().catch(() => {}));
  return { doc, collection, refreshAll, run, rpc };
}

// photos go to the private "photos" bucket; files are downloaded straight to the device
const photoStore = {
  async upload(blob, o){
    const ext = (o && o.type === "application/pdf") ? "pdf" : "jpg";
    const path = `${S.uid}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error } = await sb.storage.from("photos").upload(path, blob, { contentType:(o && o.type) || "image/jpeg", upsert:false });
    if (error) throw error;
    return { id:path, url:URL.createObjectURL(blob), sizeBytes:blob.size };
  }
};
const fileSaver = {
  async save({ filename, data }){
    const type = filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".png") ? "image/png" : filename.endsWith(".pdf") ? "application/pdf" : filename.endsWith(".json") ? "application/json" : "application/octet-stream";
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    if (/iP(hone|ad|od)/.test(navigator.userAgent) && navigator.canShare) {
      // iPhone: the share sheet lets you Save to Files, print, or AirDrop to a label printer
      const file = new File([blob], filename, { type });
      if (navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file] }); return { status:"saved" }; }
        catch (e) { if (e && e.name === "AbortError") throw { code:"declined" }; }
      }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    return { status:"saved" };
  }
};

/* ---------- merges (master admin) ---------- */
const mustOk = r => { if (r.error) throw r.error; return r.data; };
// item B into item A: B's counts and history move to A, then B goes away
async function mergeItems(keepId, dropId){
  if (keepId === dropId) return;
  const keep = find(S.items, keepId), drop = find(S.items, dropId);
  if (!keep || !drop) throw new Error("Item not found. Reload and try again.");
  mustOk(await sb.from("moves").update({ item_id:keepId }).eq("item_id", dropId));
  const patch = {};
  if (!keep.bin && drop.bin) patch.bin = drop.bin;
  if (!keep.photo && drop.photo) patch.photo = drop.photo;
  if (keep.min_qty == null && drop.min_qty != null) patch.min_qty = drop.min_qty;
  if (drop.notes) patch.notes = ((keep.notes || "") + " " + drop.notes).trim();
  if (Object.keys(patch).length) mustOk(await sb.from("items").update(patch).eq("id", keepId));
  const gone = mustOk(await sb.from("items").delete().eq("id", dropId).select("id"));
  if (!gone.length) throw new Error("Only a master admin can merge.");
}
// part B into part A (any categories): items move over, sizes line up by name, same item = merged
async function mergeParts(keepId, dropId){
  if (keepId === dropId) return;
  const keep = find(S.parts, keepId); if (!keep) throw new Error("Part not found. Reload and try again.");
  const sizeKey = n => String(n || "").trim().toLowerCase();
  const keepSizes = new Map(S.sizes.filter(z => z.part_id === keepId).map(z => [sizeKey(z.name), z.id]));
  const items = S.items.filter(i => i.part_id === dropId);
  const keepItems = new Map(S.items.filter(i => i.part_id === keepId).map(i => [i.size_id || "", i.id]));
  for (const it of items) {
    let target = null;
    if (it.size_id) {
      const nm = sizeName(it.size_id), k = sizeKey(nm);
      if (keepSizes.has(k)) target = keepSizes.get(k);
      else { mustOk(await sb.from("sizes").update({ part_id:keepId }).eq("id", it.size_id)); keepSizes.set(k, it.size_id); target = it.size_id; }
    }
    const twin = keepItems.get(target || "");
    if (twin) await mergeItems(twin, it.id);
    else { mustOk(await sb.from("items").update({ part_id:keepId, category_id:keep.category_id, size_id:target }).eq("id", it.id)); keepItems.set(target || "", it.id); }
  }
  for (const z of S.sizes.filter(z => z.part_id === dropId)) {
    if (!keepSizes.has(sizeKey(z.name))) { mustOk(await sb.from("sizes").update({ part_id:keepId }).eq("id", z.id)); keepSizes.set(sizeKey(z.name), z.id); }
  }
  const gone = mustOk(await sb.from("parts").delete().eq("id", dropId).select("id"));
  if (!gone.length) throw new Error("Only a master admin can merge.");
}

async function callUsers(body){

  if (error){
    let msg = "Couldn't reach the server. Check signal and try again.";
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

/* ---------- sign-in screens ---------- */
function showAuth(mode, note){
  const box = $("#auth"), card = $("#auth-card"); box.hidden = false;
  const head = `<h1 class="brand"><img class="logo" src="icon.svg" alt=""><span class="wm">Race Shop<b>Inventory</b></span></h1>`;
  if (mode === "setup") {
    card.innerHTML = head + `<form id="au-f" novalidate><h2>Set up the master admin</h2><p>First time here. This account controls who else can get in.</p>
      <label class="fld"><span>Your name</span><input id="au-name" autocomplete="name" required></label>
      <label class="fld"><span>Email</span><input id="au-email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="fld"><span>Password (8+ characters)</span><input id="au-pw" type="password" autocomplete="new-password" required></label>
      <label class="fld"><span>Password again</span><input id="au-pw2" type="password" autocomplete="new-password" required></label>
      <button class="go" id="au-go" type="submit">Create account</button><div class="err" id="au-err"></div></form>`;
  } else if (mode === "noaccess") {
    card.innerHTML = head + `<div class="panel"><h2>Waiting for access</h2><p>You're signed in, but your account doesn't have a user level yet. Ask a master admin to set one, then reload.</p><button class="go" id="au-reload" type="button">Reload</button><button class="linkbtn" id="au-out" type="button">Sign out</button></div>`;
  } else if (mode === "error") {
    card.innerHTML = head + `<div class="panel"><h2>Can't connect</h2><p>${esc(note || "Check your signal, then reload.")}</p><button class="go" id="au-reload" type="button">Reload</button></div>`;
  } else {
    card.innerHTML = head + `<form id="au-f" novalidate><h2>Sign in</h2>
      <label class="fld"><span>Email</span><input id="au-email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="fld"><span>Password</span><input id="au-pw" type="password" autocomplete="current-password" required></label>
      <button class="go" id="au-go" type="submit">Sign in</button><div class="err" id="au-err">${esc(note || "")}</div>
      <p>No account? Ask your master admin to add you.</p></form>`;
  }
  if ($("#au-reload")) $("#au-reload").onclick = () => location.reload();
  if ($("#au-out")) $("#au-out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const f = $("#au-f"); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const err = $("#au-err"), go = $("#au-go"); err.textContent = "";
    const email = $("#au-email").value.trim(), pw = $("#au-pw").value;
    if (!email || !pw) { err.textContent = "Enter your email and password."; return; }
    go.disabled = true; const label = go.textContent; go.textContent = "One moment…";
    try {
      if (mode === "setup") {
        if (pw !== $("#au-pw2").value) throw new Error("The two passwords don't match.");
        await callUsers({ action:"bootstrap", name:$("#au-name").value.trim(), email, password:pw });
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password:pw });
      if (error) throw new Error(/invalid/i.test(error.message) ? "Email or password is wrong." : error.message);
      await startApp(data.session);
    } catch (er) { err.textContent = er.message; go.disabled = false; go.textContent = label; }
  };
}

async function startApp(session){
  S.uid = session.user.id;
  const { data:me, error } = await sb.from("profiles").select("*").eq("id", S.uid).maybeSingle();
  if (error) { showAuth("error", "Couldn't load your account. Check signal, then reload."); return; }
  if (!me || !LEVELS[me.role] || me.role === "disabled") { showAuth("noaccess"); return; }
  S.me = me; S.role = me.role;
  document.body.classList.remove("r-viewer", "r-editor", "r-admin");
  document.body.classList.add("r-" + me.role);
  S.page = "inv"; showPage();
  $("#who").textContent = initials(me.full_name || me.email);
  $("#auth").hidden = true;
  S.assets = me.role === "viewer" ? null : photoStore;
  S.downloads = fileSaver;
  S.db = makeDb(); syncUI();
  // names for reports (who counted what); not shown on screen
  sb.rpc("team_names").then(({ data }) => { S.names = Object.fromEntries((data || []).map(r => [r.id, r.full_name])); }).catch(() => {});
  if (me.role === "viewer") setTab("stock");
  const map = { categories:"cats", parts:"parts", sizes:"sizes", items:"items", moves:"moves", locations:"locs", units:"units", unit_log:"ulog" };
  let opened = false;
  for (const [coll, key] of Object.entries(map)){
    S.db.collection(coll).onSnapshot(snap => {
      S[key] = snap.docs.filter(d => !S.deleting.has(coll + "/" + d.id)).map(d => Object.assign({ id:d.id, _pending:false }, d.data()));
      if (key === "items") for (const [k, v] of S.pendingItems) if (S.items.some(i => i.id === v.id)) S.pendingItems.delete(k);
      S.loaded.add(coll);
      renderAll();
      if (!opened && S.loaded.size === TABLES.length) { opened = true; openFromHash(); }
    }, () => { S.failed++; syncUI(); toast(`Couldn't load ${coll}. Check signal, then reload.`, "Reload", () => location.reload(), true); });
  }
}

// a scanned QR label opens the app at #CODE: jump straight to that item
function openFromHash(){
  const code = decodeURIComponent((location.hash || "").slice(1)).trim().toUpperCase();
  if (!code) return;
  try { history.replaceState(null, "", location.pathname); } catch {}
  if (!openByCode(code)) toast(`No item with code ${code}`, null, null, true);
}
window.addEventListener("hashchange", () => { if (S.loaded.size === TABLES.length) openFromHash(); });
window.addEventListener("offline", () => { $("#nodb").hidden = false; });
window.addEventListener("online", () => { $("#nodb").hidden = true; });
$("#who").onclick = openAccount;

(async () => {
  if (!sb) { showAuth("error", "Part of the app didn't load. Check your signal, then reload."); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (session) { await startApp(session); return; }
  let needsSetup = false;
  try { needsSetup = !!(await callUsers({ action:"status" })).needsSetup; } catch {}
  showAuth(needsSetup ? "setup" : "signin");
})();

})();
