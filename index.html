<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Race Inventory">
<meta name="robots" content="noindex">
<title>Race Shop Inventory</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one-column counting tool. Sticky header + tabs, fields stacked like a setup sheet, Enter bar pinned to the bottom. */
:root{
  --bg:#ECEFED; --surface:#FFFFFF; --sunk:#E1E5E3; --line:#C9CFCC;
  --ink:#15181A; --muted:#596265; --accent:#D7232F; --accent-ink:#FFFFFF;
  --cobalt:#1D56C9; --good:#1E7547; --bad:#B3261E; --shadow:0 1px 0 rgba(21,24,26,.06),0 6px 20px rgba(21,24,26,.08);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --surface:#1A1E21; --sunk:#14181A; --line:#2E3438;
  --ink:#E7EAEB; --muted:#98A1A5; --accent:#D7232F; --accent-ink:#FFFFFF;
  --cobalt:#86A9FF; --good:#4CC38A; --bad:#FF8075; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#1A1E21; --sunk:#14181A; --line:#2E3438;
  --ink:#E7EAEB; --muted:#98A1A5; --accent:#D7232F; --accent-ink:#FFFFFF;
  --cobalt:#86A9FF; --good:#4CC38A; --bad:#FF8075; --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* user levels: View only hides editing, only Master admin sees deletes and Users */
body.r-viewer .need-edit{display:none!important}
body:not(.r-admin) .need-admin{display:none!important}

/* sign-in screens */
.auth{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.auth-card{width:100%;max-width:420px;display:grid;gap:14px}
.auth-card .brand{font-size:30px}
.auth-card form,.panel{background:var(--surface);border:2px solid var(--accent);border-radius:22px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow)}
.auth-card h2{margin:0;color:var(--ink);font-size:22px}
.auth-card p,.panel p{margin:0;color:var(--muted);font-size:14px}
.fld{display:grid;gap:6px}
.fld span{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;width:100%;min-width:0;color:var(--ink)}
.go{height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 22px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.go:disabled{opacity:.6}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1px}
.ok{color:var(--good);font-weight:600;font-size:14px}
.linkbtn{border:0;background:transparent;color:var(--cobalt);font-weight:600;padding:6px 0;justify-self:start}

/* account button + users screen */
.who{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--accent);background:var(--sunk);font:700 15px/1 var(--f-display);letter-spacing:.04em;color:var(--ink)}
.ucard{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ucard:last-child{border-bottom:0}
.ucard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ucard .nm{font-weight:700;overflow-wrap:anywhere}
.ucard .em{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ucard .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ucard select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;color:var(--ink)}
.pill{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:var(--sunk);color:var(--muted)}
.pill.you{background:var(--accent);color:var(--accent-ink)}
.pwrow{display:flex;gap:8px;width:100%}
.pwrow input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface)}
.newpw{font:600 15px/1.3 var(--f-mono);background:var(--sunk);border-radius:8px;padding:8px 10px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
html,body{height:100%;overflow-x:hidden;touch-action:pan-y;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 16px+ on every text box stops iPhones from auto-zooming when a box is tapped */
input,textarea,select{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.brand{font:700 22px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;flex:none;border-radius:9px;box-shadow:0 0 0 1px var(--line)}
.brand .wm{display:block;transform:skewX(-8deg);font-size:19px;line-height:.98;font-weight:800;min-width:0;white-space:nowrap}
.brand .wm b{display:block;color:var(--accent);font-weight:800}
.brand small{display:block;font:500 11px/1.3 var(--f-body);letter-spacing:.08em;color:var(--muted);margin-top:3px}
.sync{display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;border:0;background:transparent;padding:0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.busy{display:flex}
.sync.busy i{animation:blink 1s ease-in-out infinite}
.sync.err{display:flex;color:#fff;background:var(--bad);border-radius:999px;padding:6px 10px}
.sync.err i{background:#fff}
@keyframes blink{50%{opacity:.25}}
.tabs{display:flex;gap:4px;padding-bottom:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;font:600 16px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab b{font:600 12px/1 var(--f-mono);margin-left:6px;opacity:.75}

main{padding-block:14px 120px}
.banner{border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}

/* context strip */
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 10px;text-align:left;min-width:0}
.chip span{font:600 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip strong{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip input{border:0;background:transparent;padding:0;font-weight:600;font-size:15px;width:100%;min-width:0}
.chip input::placeholder{color:var(--muted);font-weight:400}

/* form: each field is its own bubble */
.form{display:grid;gap:10px}
.field,.qtyrow,.extras-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.field{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;width:100%;padding:14px 16px;text-align:left;min-height:66px;transition:border-color .15s,transform .1s}
.field:active{transform:scale(.99)}
.field.next{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.field .lbl{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .val{font:600 20px/1.2 var(--f-body);min-width:0;overflow-wrap:anywhere}
.field .val.ph{font-weight:400;font-size:16px;color:var(--muted)}
.field .chev{color:var(--muted)}
.qtyrow{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;padding:12px 16px}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font:600 26px/1 var(--f-display)}
.qtyshow{height:56px;width:100%;min-width:0;text-align:center;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.qtyshow.ph{color:var(--muted)}
.qtyshow.active{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.keypad button{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:700 26px/1 var(--f-display);box-shadow:var(--shadow);transition:transform .08s}
.keypad button:active{transform:scale(.95);background:var(--sunk)}
.keypad button.fn{font:600 14px/1 var(--f-body);color:var(--muted)}
.kp-top{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 2px}
.kp-what{font:600 13px/1.25 var(--f-body);color:var(--muted);min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kp-num{min-width:110px;height:52px;display:flex;align-items:center;justify-content:center;padding:0 16px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);font:700 38px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.kp-num.ph{color:var(--muted)}
.kp-top .kp-x{justify-self:end}
.keypad button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.keypad .kp-x{height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;border:1.5px solid var(--accent);background:var(--surface);font:600 15px/1 var(--f-body);color:var(--ink);box-shadow:none}
.kp-x svg{width:16px;height:16px}
body.kp main{padding-bottom:420px}
.extras{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.ghost svg{width:16px;height:16px}
.ghost.on{border-color:var(--cobalt);color:var(--cobalt)}
.notein{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px}
.thumb{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumb .x{border:0;background:transparent;color:var(--bad);font-size:14px;font-weight:600}

/* enter bar */
.enterbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.enter{width:100%;height:60px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 26px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.enter:disabled{background:var(--sunk);color:var(--muted);box-shadow:none;cursor:not-allowed}
.enter small{display:block;font:500 12px/1.2 var(--f-body);letter-spacing:.02em;text-transform:none;margin-top:3px;opacity:.8}

/* lists */
h2{font:700 18px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:24px 0 8px;color:var(--muted);text-wrap:balance}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row .q{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.row .q small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted);letter-spacing:.04em}
.row.zero .q{color:var(--muted)}
.code{font:600 11.5px/1 var(--f-mono);letter-spacing:.04em;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:3px 5px;color:var(--ink)}
.undo{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.pend{color:var(--muted);font-style:italic}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.grp{font:700 15px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 2px 6px;display:flex;justify-content:space-between}

/* stock toolbar */
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;height:44px;width:100%;min-width:0;outline:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;height:44px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.sum{font-size:13px;color:var(--muted);margin:2px 2px 0}

/* sheet / picker */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,8,10,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;border-radius:22px;border:2px solid var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 18%,transparent),0 24px 70px rgba(0,0,0,.5);overflow:hidden}
.sheet .sh-hd{border-bottom-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.sh-hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-hd h3{flex:1;margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.sh-hd h3 small{display:block;font:500 12px/1.3 var(--f-body);letter-spacing:.02em;text-transform:none;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;height:36px;padding:0 10px;font-size:13px;font-weight:600}
.iconbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sh-search{padding:10px 16px}
.sh-body{overflow-y:auto;overscroll-behavior:contain;padding:0 16px 16px;min-height:0}
.bubbles{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.opt{display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:999px;padding:11px 16px;text-align:left;font-size:16px;font-weight:600;line-height:1.2;transition:transform .1s,background .15s}
.opt:active{transform:scale(.96)}
.opt .n{min-width:0;overflow-wrap:anywhere}
.opt .c{font:600 11px/1 var(--f-mono);color:var(--muted);background:var(--surface);border-radius:999px;padding:4px 7px}
.opt.sel{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.opt.sel .c{background:rgba(255,255,255,.2);color:inherit}
.opt.add{background:transparent;border-style:dashed;border-color:var(--cobalt);color:var(--cobalt)}
.opt.add svg{width:18px;height:18px;flex:none}
.opt.none{background:transparent;color:var(--muted)}
.edrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.edrow input{height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0;width:100%}
.edrow .why{grid-column:1/-1;font-size:13px;color:var(--muted)}
.edrow .why.bad{color:var(--bad);font-weight:600}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted);padding:10px 4px}

/* item detail */
.det{padding:4px 16px 18px;overflow-y:auto;min-height:0}
.det .top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start;padding:12px 0}
.qr{background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line);width:136px}
.qr img,.qr canvas{width:120px!important;height:120px!important;display:block}
.det .photo{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.binedit{display:flex;gap:8px;margin-top:10px}
.binedit input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hist .row{padding:9px 0;border-left:0;border-right:0}
.confirm{display:flex;gap:6px;align-items:center}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  .sheet{animation:rise .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes rise{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* scan */
.scanbtn{flex:none;height:38px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 16px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.scanbtn svg{width:18px;height:18px}
@media (max-width:440px){ .sync.busy span{display:none} }
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:52vh;margin:12px auto 0;width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;inset:18%;border:3px solid var(--accent);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanmsg{text-align:center;margin:10px 0 0;font-weight:600}
.manual{display:flex;gap:8px;margin-top:12px}
.manual input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;text-transform:uppercase;font-family:var(--f-mono)}

/* move */
.movebox{margin-top:12px;display:grid;gap:10px;background:var(--sunk);border:2px solid var(--accent);border-radius:18px;padding:14px}
.mvrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.mvrow .arrow{padding-bottom:12px;color:var(--muted);font-weight:700}
.movebox select{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;width:100%;min-width:0;color:var(--ink)}
.movebox .stepper input{height:56px;width:100%;min-width:0;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.movebox .lbl2{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.movebox .fld{display:grid;gap:6px}

/* menu */
.mgroup{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.mgroup:last-child{border-bottom:0}
.mgroup h4{margin:0;font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:600}
.mitem small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.mitem .chev{color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{height:42px;border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;font-weight:600}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:999px;background:var(--line);border:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.ver{font-size:12px;color:var(--muted);text-align:center;padding-top:10px}

/* labels */
.fmt{display:grid;gap:8px}
.fmt button{display:grid;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px 14px}
.fmt button b{font-size:16px}
.fmt button span{font-size:13px;color:var(--muted)}
.fmt button[aria-pressed="true"]{border-color:var(--cobalt);background:color-mix(in srgb,var(--cobalt) 12%,var(--surface))}
</style>
</head>
<body>

<section class="auth" id="auth"><div class="auth-card" id="auth-card"><h1 class="brand"><img class="logo" src="icon.svg" alt=""><span class="wm">Race Shop<b>Inventory</b></span></h1><p style="margin:0">Loading…</p></div></section>

<header>
  <div class="wrap">
    <div class="hd">
      <h1 class="brand"><img class="logo" src="icon.svg" alt=""><span class="wm">Race Shop<b>Inventory</b></span></h1>
      <button class="sync" id="sync" type="button" aria-live="polite"><i></i><span>Connecting</span></button>
      <button class="who" id="who" type="button" aria-label="Menu">?</button>
      <button class="scanbtn" id="scan" type="button" aria-label="Scan a QR label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></svg>Scan</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab need-edit" role="tab" id="tab-count" aria-selected="true" data-tab="count">Count</button>
      <button class="tab" role="tab" id="tab-stock" aria-selected="false" data-tab="stock">Stock<b id="stock-n">0</b></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="nodb" hidden>No signal. Entries won't save until you're back online.</div>

  <section id="v-count">
    <div class="ctx">
      <button class="chip" id="ctx-loc" type="button"><span>Location</span><strong id="loc-v">Shop</strong></button>
      <label class="chip" for="bin"><span>Bin / shelf</span><input id="bin" placeholder="e.g. Rack B, drawer 3" autocomplete="off" enterkeyhint="done"></label>
    </div>

    <div class="form">
      <button class="field" id="f-cat" type="button"><span class="lbl">Category</span><span class="val ph" id="cat-v">Choose or add</span><span class="chev">›</span></button>
      <button class="field" id="f-part" type="button"><span class="lbl">Part</span><span class="val ph" id="part-v">Choose or add</span><span class="chev">›</span></button>
      <button class="field" id="f-size" type="button"><span class="lbl">Size / spec</span><span class="val ph" id="size-v">Optional</span><span class="chev">›</span></button>
      <div class="qtyrow">
        <span class="lbl" style="font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Quantity</span>
        <div class="stepper">
          <button type="button" id="q-minus" aria-label="Minus one">−</button>
          <button type="button" id="qty" class="qtyshow ph" aria-label="Quantity, tap to type">0</button>
          <button type="button" id="q-plus" aria-label="Plus one">+</button>
        </div>
      </div>
      <div class="extras">
        <button class="ghost need-edit" id="b-photo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="photo-l">Photo</span></button>
        <button class="ghost" id="b-note" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5h14v10l-4 4H5z"/><path d="M8 9h8M8 13h5"/></svg>Note</button>
        <input type="file" id="photo-in" accept="image/*" capture="environment" class="sr" tabindex="-1">
      </div>
      <div class="thumb" id="thumb" hidden><img id="thumb-img" alt="Photo for this entry"><span id="thumb-s" style="font-size:13px;color:var(--muted)"></span><button class="x" id="thumb-x" type="button">Remove</button></div>
      <input class="notein" id="note" placeholder="Note (condition, serial, etc.)" hidden autocomplete="off" enterkeyhint="done">
    </div>

    <h2>Just counted</h2>
    <div class="list" id="recent"></div>
  </section>

  <section id="v-stock" hidden>
    <div class="tools">
      <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg><input id="q" placeholder="Search part, size, code, bin" autocomplete="off"></label>
      <button class="btn" id="b-labels" type="button">Labels</button>
    </div>
    <div class="seg" id="locf"></div>
    <div class="sum" id="sum"></div>
    <div id="stock"></div>
  </section>
</main>

<div class="enterbar" id="enterbar"><div class="wrap">
  <div class="keypad" id="keypad" hidden>
    <div class="kp-top"><span class="kp-what" id="kp-what">Quantity</span><output class="kp-num" id="kp-num" aria-live="polite">0</output><button type="button" data-k="close" class="kp-x" aria-label="Close number pad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</button></div>
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
    <button type="button" data-k="clear" class="fn">Clear</button><button type="button" data-k="0">0</button><button type="button" data-k="back" class="fn" aria-label="Backspace">⌫ Back</button>
  </div>
  <button class="enter" id="enter" type="button" disabled>Enter<small id="enter-s">Pick a category and part</small></button></div></div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/["”″]/g,' in').replace(/[^a-z0-9.\/]+/g," ").replace(/\b([a-z]{3,})s\b/g,"$1").trim();
const byName = (a,b) => String(a.name).localeCompare(String(b.name), undefined, {numeric:true, sensitivity:"base"});
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("rsi:"+k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem("rsi:"+k, JSON.stringify(v)); } catch {} }
};
const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

const S = {
  db:null, assets:null, downloads:null, uid:null,
  cats:[], parts:[], sizes:[], items:[], moves:[], locs:[],
  loaded:new Set(),
  sel:{ cat: store.get("cat"), part:null, size:null, loc: store.get("loc") },
  bin: store.get("bin") || "",
  photo:null, // {id,url,uploading}
  tab:"count", q:"", locFilter:"all",
  inflight:0, failed:0,
  pendingItems:new Map(), deleting:new Set(),
};

/* ---------- theme (Auto follows the phone) ---------- */
function applyTheme(v){ const r = document.documentElement; if (v === "light" || v === "dark") r.dataset.theme = v; else delete r.dataset.theme; }
applyTheme(store.get("theme"));

/* ---------- lookups ---------- */
const find = (arr,id) => arr.find(x => x.id === id);
const catName = id => find(S.cats,id)?.name || "Uncategorized";
const partName = id => find(S.parts,id)?.name || "Unknown part";
const sizeName = id => id ? (find(S.sizes,id)?.name || "") : "";
const locName = id => find(S.locs,id)?.name || "Shop";
const itemTitle = it => partName(it.part_id) + (it.size_id ? " · " + sizeName(it.size_id) : "");
function totals(){
  const t = new Map();
  for (const m of S.moves){
    if (!t.has(m.item_id)) t.set(m.item_id, {});
    const o = t.get(m.item_id); o[m.location_id] = (o[m.location_id]||0) + (Number(m.qty)||0);
  }
  return t;
}
function shopLocId(){ const s = S.locs.find(l => norm(l.name) === "shop"); return s ? s.id : (S.locs[0]?.id || null); }

/* ---------- sync status ---------- */
function syncUI(){
  const el = $("#sync"), sp = el.querySelector("span");
  el.classList.toggle("busy", S.inflight > 0);
  el.classList.toggle("err", S.failed > 0 && S.inflight === 0);
  if (!S.db) { sp.textContent = "Not connected"; return; }
  sp.textContent = S.inflight > 0 ? "Saving…" : S.failed > 0 ? "Not saved" : "All saved";
  el.title = S.failed > 0 ? "Some changes didn't save. Tap Retry on the message, or check your signal." : "";
}
function write(promiseFn, label){
  S.inflight++; syncUI();
  const run = () => promiseFn().then(() => { S.inflight--; syncUI(); }, (e) => {
    S.inflight--;
    if (e && e.code === "unavailable" && !run.retried) { run.retried = true; S.inflight++; return new Promise(r => setTimeout(r, 600 + Math.random()*600)).then(run); }
    S.failed++; syncUI();
    const perm = e && (e.code === "42501" || /row-level security|permission|not allowed/i.test(e.message || ""));
    if (perm) { S.failed = Math.max(0, S.failed - 1); syncUI(); toast("Your account can't make that change. Ask a master admin.", null, null, true); if (S.db && S.db.refreshAll) S.db.refreshAll().catch(() => {}); return; }
    const msg = `Couldn't save ${label}. Check signal, then tap Retry.`;
    toast(msg, "Retry", () => { S.failed = Math.max(0, S.failed-1); run.retried = false; S.inflight++; syncUI(); run(); }, true);
  });
  return run();
}

/* ---------- toast ---------- */
let toastT;
function toast(text, action, fn, bad){
  const t = $("#toast");
  t.className = "toast" + (bad ? " bad" : "");
  t.innerHTML = `<span>${esc(text)}</span>` + (action ? `<button type="button">${esc(action)}</button>` : "");
  t.hidden = false;
  if (action) t.querySelector("button").onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 8000 : 3200);
}

/* ---------- count form ---------- */
S.qtyStr = ""; S.qtyActive = false;
function qtyVal(){ const n = parseInt(S.qtyStr, 10); return isNaN(n) ? 0 : n; }
function setQty(v){
  S.qtyStr = String(v ?? "").replace(/[^0-9]/g,"").replace(/^0+(?=\d)/,"").slice(0,5);
  for (const el of [$("#qty"), $("#kp-num")]) { el.textContent = S.qtyStr || "0"; el.classList.toggle("ph", !S.qtyStr); }
  renderForm();
}
function keypadUI(){
  const on = S.qtyActive && S.tab === "count";
  $("#keypad").hidden = !on; $("#qty").classList.toggle("active", on); document.body.classList.toggle("kp", on);
  if (on) {
    const p = find(S.parts, S.sel.part), z = find(S.sizes, S.sel.size);
    $("#kp-what").textContent = p ? p.name + (z ? " · " + z.name : "") : "Quantity";
    requestAnimationFrame(() => { $("main").style.paddingBottom = ($("#enterbar").offsetHeight + 24) + "px"; });
  } else $("main").style.paddingBottom = "";
}
function closePad(){ if (!S.qtyActive) return; S.qtyActive = false; keypadUI(); }
function renderForm(){
  const c = find(S.cats, S.sel.cat), p = find(S.parts, S.sel.part), z = find(S.sizes, S.sel.size);
  if (S.sel.cat && !c && S.loaded.has("categories")) S.sel.cat = null;
  if (S.sel.part && (!p || p.category_id !== S.sel.cat)) { if (S.loaded.has("parts")) { S.sel.part = null; S.sel.size = null; } }
  setVal("#cat-v", c?.name, "Choose or add");
  setVal("#part-v", p?.name, S.sel.cat ? "Choose or add" : "Pick a category first");
  setVal("#size-v", z?.name, "Optional");
  $("#f-part").classList.toggle("next", !!S.sel.cat && !S.sel.part);
  $("#f-cat").classList.toggle("next", !S.sel.cat);
  if (!S.sel.loc || !find(S.locs, S.sel.loc)) { if (S.loaded.has("locations")) S.sel.loc = shopLocId(); }
  $("#loc-v").textContent = S.sel.loc ? locName(S.sel.loc) : "Shop";
  const btn = $("#enter"), s = $("#enter-s");
  let why = "";
  if (!S.db) why = "Saving unavailable here";
  else if (!S.sel.cat) why = "Pick a category";
  else if (!S.sel.part) why = "Pick a part";
  else if (qtyVal() <= 0) why = "Enter a quantity";
  else if (S.photo && S.photo.uploading) why = "Uploading photo…";
  btn.disabled = !!why;
  s.textContent = why || `${qtyVal()} × ${p?.name || ""}${z ? " " + z.name : ""} → ${locName(S.sel.loc)}`;
}
function setVal(sel, v, ph){ const el = $(sel); el.textContent = v || ph; el.classList.toggle("ph", !v); }

function renderRecent(){
  const el = $("#recent");
  const ms = S.moves.filter(m => !m.type || m.type === "count").sort((a,b) => (b.ts||0) - (a.ts||0)).slice(0, 8);
  if (!ms.length){
    el.innerHTML = `<div class="empty"><strong>Nothing counted yet</strong>Pick a category and part, type the quantity, and press Enter. Each entry shows up here so you can undo it.</div>`;
    return;
  }
  el.innerHTML = ms.map(m => {
    const it = find(S.items, m.item_id);
    const title = it ? itemTitle(it) : "…";
    return `<div class="row"><div><div class="t">${esc(m.qty)} × ${esc(title)}</div><div class="m">${it ? `<span class="code">${esc(it.code)}</span>` : ""}<span>${esc(locName(m.location_id))}${m.bin ? " · " + esc(m.bin) : ""}</span>${m._pending ? '<span class="pend">saving</span>' : ""}</div></div><button class="undo" data-undo="${esc(m.id)}" type="button">Undo</button></div>`;
  }).join("");
}

function enter(){
  if ($("#enter").disabled) return;
  const db = S.db, now = Date.now();
  if (!S.sel.loc) {
    const ref = db.collection("locations").doc("shop");
    write(() => ref.set({ name:"Shop", sort:1, created_at:new Date().toISOString() }), "location");
    S.sel.loc = "shop";
  }
  const key = [S.sel.cat, S.sel.part, S.sel.size || ""].join("|");
  let item = S.items.find(i => i.category_id === S.sel.cat && i.part_id === S.sel.part && (i.size_id || "") === (S.sel.size || "")) || S.pendingItems.get(key);
  const bin = $("#bin").value.trim();
  const photo = S.photo && S.photo.id || null;
  if (!item){
    const ref = db.collection("items").doc();
    item = { id: ref.id, code: newCode(S.sel.cat), category_id:S.sel.cat, part_id:S.sel.part, size_id:S.sel.size || null, bin, photo, notes:"", created_at:new Date(now).toISOString(), created_by:S.uid };
    S.pendingItems.set(key, item);
    const data = Object.assign({}, item); delete data.id;
    write(() => ref.set(data), "the new item");
  } else {
    const patch = {};
    if (!item.bin && bin) patch.bin = bin;
    if (!item.photo && photo) patch.photo = photo;
    if (Object.keys(patch).length && !S.pendingItems.has(key)) { const id = item.id; write(() => db.doc("items/" + id).update(patch), "the item"); }
  }
  const mref = db.collection("moves").doc();
  const move = { item_id:item.id, qty:qtyVal(), type:"count", location_id:S.sel.loc, bin, note:$("#note").value.trim(), photo, by:S.uid, at:new Date(now).toISOString(), ts:now };
  write(() => mref.set(move), "that entry");
  toast(`Saved ${move.qty} × ${itemTitle(item)}`, "Undo", () => undoMove(mref.id));
  // reset for next entry; category, location and bin stay
  S.sel.part = null; S.sel.size = null; S.qtyActive = false; setQty(""); keypadUI(); $("#note").value = ""; $("#note").hidden = true; $("#b-note").classList.remove("on");
  clearPhoto();
  renderAll();
  if (store.get("autonext") !== false) openPartPicker();
}
function undoMove(id){
  const db = S.db, m = find(S.moves, id);
  // a Move between locations is two linked rows; remove both together
  const ids = m && m.transfer_id ? S.moves.filter(x => x.transfer_id === m.transfer_id).map(x => x.id) : [id];
  write(async () => { for (const x of ids) await db.doc("moves/" + x).delete(); }, "the undo");
  S.moves = S.moves.filter(x => !ids.includes(x.id)); renderAll();
}
const nameOf = uid => (S.names && S.names[uid]) || "";
const initialsOf = uid => { const n = nameOf(uid); return n ? n.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 3).toUpperCase() : ""; };
const typeName = t => ({ count:"Count", transfer:"Move", used:"Used", damaged:"Damaged", adjust:"Adjust", check_out:"Check out", check_in:"Check in" }[t || "count"] || t);
const stamp = m => { const d = new Date(m.ts || m.at); if (isNaN(d)) return m.at || ""; const z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const ALPH = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
function newCode(catId){
  const pre = (catName(catId).replace(/[^A-Za-z]/g,"").slice(0,3) || "ITM").toUpperCase();
  const taken = new Set(S.items.map(i => i.code).concat([...S.pendingItems.values()].map(i => i.code)));
  for (let n = 0; n < 50; n++){
    let c = pre + "-"; const r = crypto.getRandomValues(new Uint8Array(4));
    for (const b of r) c += ALPH[b % ALPH.length];
    if (!taken.has(c)) return c;
  }
  return pre + "-" + now36();
}
function now36(){ return Date.now().toString(36).toUpperCase().slice(-6); }

/* ---------- photo ---------- */
function clearPhoto(){ S.photo = null; $("#thumb").hidden = true; $("#photo-l").textContent = "Photo"; $("#b-photo").classList.remove("on"); $("#photo-in").value = ""; }
async function compress(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1280, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", 0.7));
  } finally { URL.revokeObjectURL(url); }
}

function mkDoc(coll, data){
  const ref = S.db.collection(coll).doc();
  const body = Object.assign({ created_at:new Date().toISOString() }, data);
  // show it in the list right away so it can be selected before the save comes back
  const key = { categories:"cats", parts:"parts", sizes:"sizes", locations:"locs" }[coll];
  if (key && !S[key].some(x => x.id === ref.id)) S[key] = S[key].concat([Object.assign({ id:ref.id, _pending:true }, body)]);
  write(() => ref.set(body), "the new " + coll.replace(/ies$/,"y").replace(/s$/,""));
  return ref.id;
}

/* ---------- cascading delete ---------- */
// Works out everything that goes with a category, part, size or item, so nothing is left orphaned.
function deletePlan(spec){
  const cats = new Set(spec.cats || []);
  const parts = new Set((spec.parts || []).concat(S.parts.filter(p => cats.has(p.category_id)).map(p => p.id)));
  const sizes = new Set((spec.sizes || []).concat(S.sizes.filter(z => parts.has(z.part_id)).map(z => z.id)));
  const items = new Set((spec.items || []).concat(S.items.filter(i => cats.has(i.category_id) || parts.has(i.part_id) || (i.size_id && sizes.has(i.size_id))).map(i => i.id)));
  const moves = S.moves.filter(m => items.has(m.item_id)).map(m => m.id);
  return { cats, parts, sizes, items, moves };
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
function describePlan(pl, skip){
  const bits = [];
  if (skip !== "parts" && pl.parts.size) bits.push(plural(pl.parts.size, "part"));
  if (skip !== "sizes" && pl.sizes.size) bits.push(plural(pl.sizes.size, "size"));
  if (skip !== "items" && pl.items.size) bits.push(plural(pl.items.size, "stock item"));
  if (pl.moves.length) bits.push(plural(pl.moves.length, "count entry").replace("entrys", "entries"));
  return bits.join(", ");
}
function runPlan(pl){
  const db = S.db;
  const jobs = [].concat(
    pl.moves.map(id => "moves/" + id), [...pl.items].map(id => "items/" + id),
    [...pl.sizes].map(id => "sizes/" + id), [...pl.parts].map(id => "parts/" + id), [...pl.cats].map(id => "categories/" + id));
  // one at a time, in order, so a big delete never trips the rate limit
  jobs.forEach(j => S.deleting.add(j)); // hide these from incoming updates until the delete finishes
  write(async () => {
    try { for (const path of jobs) { await db.doc(path).delete(); S.deleting.delete(path); } }
    finally { jobs.forEach(j => S.deleting.delete(j)); }
  }, "the delete");
  S.moves = S.moves.filter(m => !pl.items.has(m.item_id));
  S.items = S.items.filter(i => !pl.items.has(i.id));
  S.sizes = S.sizes.filter(z => !pl.sizes.has(z.id));
  S.parts = S.parts.filter(x => !pl.parts.has(x.id));
  S.cats = S.cats.filter(c => !pl.cats.has(c.id));
  if (pl.cats.has(S.sel.cat)) { S.sel.cat = null; store.set("cat", null); }
  if (pl.parts.has(S.sel.part)) { S.sel.part = null; S.sel.size = null; }
  if (pl.sizes.has(S.sel.size)) S.sel.size = null;
  renderAll(); renderPicker();
}

  const el = $("#stock");

function labelCanvas(it){
  const holder = document.createElement("div");
  new QRCode(holder, { text: qrText(it.code), width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });
  const qc = holder.querySelector("canvas");
  const c = document.createElement("canvas"); c.width = 1050; c.height = 450;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height);
  if (qc) x.drawImage(qc, 45, 45, 360, 360);

function wrapText(x, text, X, Y, w, lh, maxLines){
  const words = String(text).split(/\s+/); let line = "", n = 0;

let scanStream = null, scanTimer = null;

const codeFrom = text => { const v = String(text || "").trim(); const h = v.lastIndexOf("#"); return (h >= 0 ? v.slice(h + 1) : v).trim().toUpperCase(); };

  navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false }).then(stream => {
    if ($("#scrim").hidden || !$("#sc-v")) { stream.getTracks().forEach(tr => tr.stop()); return; }
    scanStream = stream;
    const v = $("#sc-v"); v.srcObject = stream; v.play().catch(() => {});
    msg("Looking for a QR code…");
    const c = document.createElement("canvas"), x = c.getContext("2d", { willReadFrequently:true });
    let lastMiss = "";
    const tick = () => {
      if (!scanStream) return;
      if (v.readyState >= 2 && v.videoWidth) {
        const w = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
        c.width = w; c.height = h; x.drawImage(v, 0, 0, w, h);

        if (r && r.data) {

          const code = codeFrom(r.data);
          if (code !== lastMiss) { lastMiss = code; msg(`No item with code ${code}. Try another label.`); }
        }
      }
      scanTimer = setTimeout(tick, 140);
    };
    tick();
  }).catch(() => msg("Camera is blocked. Allow camera access for this site in your browser settings, or type the code below."));

// A small store with the same shape the screens already use (collection/doc/onSnapshot),

function makeDb(){
  const cache = {}, subs = {};

      if (error) throw error;

    }

  }
  async function refresh(t){ const rows = await fetchAll(t); cache[t] = new Map(rows.map(r => [r.id, r])); emit(t); }
  const put = (t, row) => { const m = cache[t] = cache[t] || new Map(); m.set(row.id, Object.assign({}, m.get(row.id) || {}, row)); emit(t); };
  const drop = (t, id) => { if (cache[t]) cache[t].delete(id); emit(t); };
  const clean = d => { const o = {}; for (const [k, v] of Object.entries(d)) if (!k.startsWith("_") && v !== undefined) o[k] = v; return o; };
  const denied = () => ({ code:"42501", message:"not allowed" });
  // Every save waits for the one before it. A new item always reaches the database
  // before the count that points at it, even on a slow phone connection.
  let chain = Promise.resolve();
  const inOrder = fn => { const p = chain.then(fn, fn); chain = p.catch(() => {}); return p; };
  const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join("");

        const { error } = await inOrder(() => sb.from(t).upsert(row));
        if (error){ refresh(t).catch(() => {}); throw error; }
      },
      async update(data){
        const ch = clean(data); put(t, Object.assign({ id }, ch));
        const { data: got, error } = await inOrder(() => sb.from(t).update(ch).eq("id", id).select("id"));
        if (error || !got.length){ refresh(t).catch(() => {}); throw error || denied(); }

      path:t,
      doc: id => doc(t + "/" + (id || newId())),
      onSnapshot(next, err){ (subs[t] = subs[t] || []).push(next); refresh(t).catch(e => err && err(e)); return () => {}; },
    };
  }
  const refreshAll = () => Promise.all(TABLES.filter(t => subs[t]).map(t => refresh(t)));
  let first = true;
  const ch = sb.channel("inventory-live");
  TABLES.forEach(t => ch.on("postgres_changes", { event:"*", schema:"public", table:t }, p => {
    if (p.eventType === "DELETE") { if (p.old && p.old.id) drop(t, p.old.id); }
    else if (p.new && p.new.id) put(t, p.new);
  }));
  ch.subscribe(status => {
    if (status === "SUBSCRIBED") { if (!first) refreshAll().catch(() => {}); first = false; }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshAll().catch(() => {}); });
  window.addEventListener("online", () => refreshAll().catch(() => {}));
  return { doc, collection, refreshAll };
}

// photos go to the private "photos" bucket; files are downloaded straight to the device
const photoStore = {
  async upload(blob, o){
    const path = `${S.uid}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from("photos").upload(path, blob, { contentType:(o && o.type) || "image/jpeg", upsert:false });
    if (error) throw error;
    return { id:path, url:URL.createObjectURL(blob), sizeBytes:blob.size };
  }
};
const fileSaver = {
  async save({ filename, data }){
    const type = filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".png") ? "image/png" : filename.endsWith(".pdf") ? "application/pdf" : "application/octet-stream";
    const blob = data instanceof Blob ? data : new Blob([data], { type });
    if (/iP(hone|ad|od)/.test(navigator.userAgent) && navigator.canShare) {
      // iPhone: the share sheet lets you Save to Files, print, or AirDrop to a label printer
      const file = new File([blob], filename, { type });
      if (navigator.canShare({ files:[file] })) {
        try { await navigator.share({ files:[file] }); return { status:"saved" }; }
        catch (e) { if (e && e.name === "AbortError") throw { code:"declined" }; }
      }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    return { status:"saved" };
  }
};

/* ---------- user management (master admin) ---------- */
async function callUsers(body){
  const { data, error } = await sb.functions.invoke("manage-users", { body });
  if (error){
    let msg = "Couldn't reach the server. Check signal and try again.";
    try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

    <div class="sh-hd"><h3 id="us-t">Users<small>Who can open the inventory and what they can do</small></h3><button class="iconbtn" id="us-x" type="button">Close</button></div>

          <label class="fld"><span>User level</span><select id="nu-role"><option value="viewer">View only — can look, can't change</option><option value="editor" selected>Editor — can count, add parts, undo</option><option value="admin">Master admin — everything, plus deletes and users</option></select></label>

async function loadUsers(){
  const box = $("#us-list"); if (!box) return;
  let users;
  try { users = (await callUsers({ action:"list" })).users || []; }
  catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  box.innerHTML = users.map(u => `<div class="ucard" data-u="${esc(u.id)}">
      <div class="top"><span class="nm">${esc(u.full_name || u.email)}</span>${u.id === S.uid ? `<span class="pill you">You</span>` : `<span class="pill">${u.last_sign_in_at ? "Last in " + esc(new Date(u.last_sign_in_at).toLocaleDateString([], { month:"short", day:"numeric" })) : "Never signed in"}</span>`}</div>
      <div class="em">${esc(u.email || "")}</div>
      <div class="row2">
        <select aria-label="User level for ${esc(u.full_name || u.email)}" data-role>${Object.entries(LEVELS).map(([k, v]) => `<option value="${k}" ${u.role === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        <button class="btn" type="button" data-reset>Reset password</button>
        ${u.id === S.uid ? "" : `<button class="btn danger" type="button" data-remove>Remove</button>`}
      </div>
      <div class="pwrow" data-pwbox hidden><input placeholder="New password" autocomplete="off"><button class="btn" type="button" data-pwsave>Save</button></div>
      <div class="err" data-msg></div>
    </div>`).join("") || `<p class="hint">No users yet.</p>`;
  box.querySelectorAll(".ucard").forEach(card => {
    const id = card.dataset.u, msg = card.querySelector("[data-msg]");
    card.querySelector("[data-role]").onchange = async e => {
      msg.textContent = "";
      try { await callUsers({ action:"set_role", id, role:e.target.value }); toast("User level saved"); if (id === S.uid) location.reload(); }
      catch (er) { msg.textContent = er.message; loadUsers(); }
    };

    card.querySelector("[data-pwsave]").onclick = async () => {
      const pw = card.querySelector("[data-pwbox] input").value; msg.textContent = "";

      catch (er) { msg.className = "err"; msg.textContent = er.message; }

      if (!rm.dataset.armed) { rm.dataset.armed = "1"; rm.textContent = "Confirm remove"; rm.classList.add("armed"); msg.className = "err"; msg.textContent = "They lose access right away. Their past counts stay."; return; }

      catch (er) { msg.textContent = er.message; }

  });
}

/* ---------- sign-in screens ---------- */
function showAuth(mode, note){
  const box = $("#auth"), card = $("#auth-card"); box.hidden = false;
  const head = `<h1 class="brand"><img class="logo" src="icon.svg" alt=""><span class="wm">Race Shop<b>Inventory</b></span></h1>`;
  if (mode === "setup") {
    card.innerHTML = head + `<form id="au-f" novalidate><h2>Set up the master admin</h2><p>First time here. This account controls who else can get in.</p>
      <label class="fld"><span>Your name</span><input id="au-name" autocomplete="name" required></label>
      <label class="fld"><span>Email</span><input id="au-email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="fld"><span>Password (8+ characters)</span><input id="au-pw" type="password" autocomplete="new-password" required></label>
      <label class="fld"><span>Password again</span><input id="au-pw2" type="password" autocomplete="new-password" required></label>
      <button class="go" id="au-go" type="submit">Create account</button><div class="err" id="au-err"></div></form>`;
  } else if (mode === "noaccess") {
    card.innerHTML = head + `<div class="panel"><h2>Waiting for access</h2><p>You're signed in, but your account doesn't have a user level yet. Ask a master admin to set one, then reload.</p><button class="go" id="au-reload" type="button">Reload</button><button class="linkbtn" id="au-out" type="button">Sign out</button></div>`;
  } else if (mode === "error") {
    card.innerHTML = head + `<div class="panel"><h2>Can't connect</h2><p>${esc(note || "Check your signal, then reload.")}</p><button class="go" id="au-reload" type="button">Reload</button></div>`;
  } else {
    card.innerHTML = head + `<form id="au-f" novalidate><h2>Sign in</h2>
      <label class="fld"><span>Email</span><input id="au-email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="fld"><span>Password</span><input id="au-pw" type="password" autocomplete="current-password" required></label>
      <button class="go" id="au-go" type="submit">Sign in</button><div class="err" id="au-err">${esc(note || "")}</div>
      <p>No account? Ask your master admin to add you.</p></form>`;
  }
  if ($("#au-reload")) $("#au-reload").onclick = () => location.reload();
  if ($("#au-out")) $("#au-out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const f = $("#au-f"); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const err = $("#au-err"), go = $("#au-go"); err.textContent = "";
    const email = $("#au-email").value.trim(), pw = $("#au-pw").value;
    if (!email || !pw) { err.textContent = "Enter your email and password."; return; }
    go.disabled = true; const label = go.textContent; go.textContent = "One moment…";
    try {
      if (mode === "setup") {
        if (pw !== $("#au-pw2").value) throw new Error("The two passwords don't match.");
        await callUsers({ action:"bootstrap", name:$("#au-name").value.trim(), email, password:pw });
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password:pw });
      if (error) throw new Error(/invalid/i.test(error.message) ? "Email or password is wrong." : error.message);
      await startApp(data.session);
    } catch (er) { err.textContent = er.message; go.disabled = false; go.textContent = label; }
  };
}

async function startApp(session){
  S.uid = session.user.id;
  const { data:me, error } = await sb.from("profiles").select("*").eq("id", S.uid).maybeSingle();
  if (error) { showAuth("error", "Couldn't load your account. Check signal, then reload."); return; }
  if (!me || !LEVELS[me.role] || me.role === "disabled") { showAuth("noaccess"); return; }
  S.me = me; S.role = me.role;
  document.body.classList.remove("r-viewer", "r-editor", "r-admin");
  document.body.classList.add("r-" + me.role);
  $("#who").textContent = initials(me.full_name || me.email);
  $("#auth").hidden = true;
  S.assets = me.role === "viewer" ? null : photoStore;
  S.downloads = fileSaver;
  S.db = makeDb(); syncUI();
  // names for reports (who counted what); not shown on screen
  sb.rpc("team_names").then(({ data }) => { S.names = Object.fromEntries((data || []).map(r => [r.id, r.full_name])); }).catch(() => {});
  if (me.role === "viewer") setTab("stock");
  const map = { categories:"cats", parts:"parts", sizes:"sizes", items:"items", moves:"moves", locations:"locs" };
  let opened = false;
  for (const [coll, key] of Object.entries(map)){
    S.db.collection(coll).onSnapshot(snap => {
      S[key] = snap.docs.filter(d => !S.deleting.has(coll + "/" + d.id)).map(d => Object.assign({ id:d.id, _pending:false }, d.data()));
      if (key === "items") for (const [k, v] of S.pendingItems) if (S.items.some(i => i.id === v.id)) S.pendingItems.delete(k);
      S.loaded.add(coll);
      renderAll();
      if (!opened && S.loaded.size === TABLES.length) { opened = true; openFromHash(); }
    }, () => { S.failed++; syncUI(); toast(`Couldn't load ${coll}. Check signal, then reload.`, "Reload", () => location.reload(), true); });
  }
}

// a scanned QR label opens the app at #CODE: jump straight to that item
function openFromHash(){
  const code = decodeURIComponent((location.hash || "").slice(1)).trim().toUpperCase();
  if (!code) return;
  try { history.replaceState(null, "", location.pathname); } catch {}
  const it = S.items.find(i => i.code === code);
  if (it) { setTab("stock"); openItem(it.id); }
  else toast(`No item with code ${code}`, null, null, true);
}
window.addEventListener("hashchange", () => { if (S.loaded.size === TABLES.length) openFromHash(); });
window.addEventListener("offline", () => { $("#nodb").hidden = false; });
window.addEventListener("online", () => { $("#nodb").hidden = true; });
$("#who").onclick = openAccount;

(async () => {
  if (!sb) { showAuth("error", "Part of the app didn't load. Check your signal, then reload."); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if (session) { await startApp(session); return; }
  let needsSetup = false;
  try { needsSetup = !!(await callUsers({ action:"status" })).needsSetup; } catch {}
  showAuth(needsSetup ? "setup" : "signin");
})();
